# Local development only. Nothing here is meant to run in production:
# production is Neon for Postgres, Fly.io for the api and Vercel for the web.
name: porter

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      # No fallback values on purpose. An empty password would silently give
      # every local connection trust auth, so compose must fail instead.
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 moved PGDATA to /var/lib/postgresql/18/docker and declares
      # the volume one level up. Mounting the old /var/lib/postgresql/data
      # would keep the real data inside the container layer, so it would be
      # lost on every recreate.
      - db-data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 forces TCP on purpose. Without it pg_isready uses the
      # unix socket, and during first-time init the entrypoint runs a
      # temporary server that listens on the socket only. The check would
      # then report healthy while nothing accepts TCP yet, and anything with
      # depends_on: service_healthy would start too early. The real server is
      # the first thing in this container to listen on TCP.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # The integration suite truncates tables, so it never points at the
  # development database. Behind a profile: `docker compose up` does not start
  # it, `docker compose --profile test up -d --wait postgres-test` does.
  postgres-test:
    image: postgres:18.6
    profiles: [test]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    # Data on tmpfs: it lives in memory, dies with the container and never
    # needs cleaning up. A test database with a volume is a test database that
    # eventually holds yesterday's rows.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

volumes:
  db-data:
