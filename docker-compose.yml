# Local development only. Nothing here is meant to run in production:
# production is Neon for Postgres, Fly.io for the api and Vercel for the web.
name: porter

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      # No fallback values on purpose. An empty password would silently give
      # every local connection trust auth, so compose must fail instead.
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 moved PGDATA to /var/lib/postgresql/18/docker and declares
      # the volume one level up. Mounting the old /var/lib/postgresql/data
      # would keep the real data inside the container layer, so it would be
      # lost on every recreate.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db-data:
