packages:
  - "apps/api"
  - "apps/web"
  - "packages/*"
# apps/mobile is intentionally absent: Flutter has its own package system
# (pubspec.yaml) and its own CI step.

# Shared tool versions, declared once. Without this, `pnpm add typescript` in
# any workspace quietly pulls the latest major and breaks type-aware linting:
# typescript-eslint supports >=4.8.4 <6.1.0, and TypeScript 7 is out.
catalog:
  eslint: ^10.13.0
  typescript: ~6.0.3
  # Prisma's `latest` dist-tag points at a release candidate (8.0.0-rc), while
  # the stable line is tagged `prev`. The CLI and the client must stay on the
  # same major, so both versions live here instead of in two manifests.
  prisma: ~7.10.1
  "@prisma/client": ~7.10.1

# openapi-typescript 7.13 still declares `typescript: ^5.x` as a peer, and this
# repository is on 6. Answered here rather than left as a warning on every
# install, and answered this way rather than by pinning TypeScript 5 in that one
# package: two TypeScript versions in one repository is the thing the catalog
# above exists to prevent. Checked on 13.11.2026 -- it generates the document's
# types correctly on 6, and its output is typechecked by our own compiler
# afterwards, so a real incompatibility fails loudly rather than silently.
peerDependencyRules:
  allowedVersions:
    "openapi-typescript>typescript": "6"

# Which packages may execute code during install. pnpm blocks install scripts
# by default, and that is the right default: such a script runs with the
# developer's privileges before anyone has read a line of the package.
#
# Every package that asks is answered here by name, true or false, and the
# answer is reviewed in the pull request that adds it. An undecided package
# fails the install, so the list cannot rot quietly.
#
# prisma, @prisma/engines  place the schema-engine binary; no migrations without it
# esbuild                  links the platform binary vitest runs on
# @swc/core                arrives through @nestjs/cli for its SWC builder,
#                          which this project does not use: nest build runs tsc
# @scarf/scarf             arrives through @nestjs/swagger; its install script
#                          posts an install report to scarf.sh. Nothing in the
#                          build needs it, and an outbound call from `pnpm
#                          install` is not something this project asks for
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': false
  esbuild: true
  prisma: true
